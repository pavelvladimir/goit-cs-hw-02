services:
  app:
    build: .
    stop_signal: SIGTERM
    stop_grace_period: ${SHUTDOWN_GRACE_SECONDS:-20}s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-20}
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthchecker', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  db:
    # Multi-platform index digest, shared by linux/amd64 and linux/arm64.
    image: percona/percona-distribution-postgresql:17.11@sha256:b5e66df1a76d7309241e03d1bc741b53d2d867f27e21389e0512c81d05024969
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: /data/db
    secrets:
      - postgres_password
      - db_password
    volumes:
      - percona_postgres17_data:/data/db
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  percona_postgres17_data:

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-./secrets/db_password}
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./secrets/postgres_password}
